name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push on the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  algo:
    name: Algo (FizzBuzz)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: algo

      - name: Validate composer.json
        run: composer validate --strict

      - name: Coding style
        run: composer cs

      - name: Static analysis
        run: composer phpstan

      - name: Unit tests
        run: composer test

  backend:
    name: Backend (fleet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet -d fleet_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://fleet:fleet@127.0.0.1:5432/fleet_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: backend

      - name: Validate composer.json
        run: composer validate --strict

      - name: Security audit of dependencies
        run: composer audit

      - name: Coding style
        run: composer cs

      - name: Static analysis
        run: composer phpstan

      - name: Architecture rules
        run: composer deptrac

      - name: Unit tests
        run: composer test:unit

      - name: Create the test database schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Integration tests
        run: composer test:integration

      - name: Acceptance tests (in memory + PostgreSQL)
        run: composer behat
