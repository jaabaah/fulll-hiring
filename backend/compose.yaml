name: fleet

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - ./database/schema.sql:/schema/schema.sql:ro
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
