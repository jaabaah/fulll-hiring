# Enforces the hexagonal architecture: dependencies always point towards the domain.
deptrac:
  paths:
    - ./src
  layers:
    - name: Domain
      collectors:
        - type: classLike
          value: ^Fulll\\Domain\\.*
    - name: App
      collectors:
        - type: classLike
          value: ^Fulll\\App\\.*
    - name: Infra
      collectors:
        - type: classLike
          value: ^Fulll\\Infra\\.*
    - name: Vendor
      collectors:
        - type: classLike
          value: ^Symfony\\.*
    # PHP's own classes are ignored by default, so the database extension needs a layer of its own.
    - name: Pdo
      collectors:
        - type: php_internal
          value: ^PDO
  ruleset:
    Domain: ~                          # pure PHP: depends on nothing
    App: [Domain]                      # use cases orchestrate the domain
    Infra: [App, Domain, Vendor, Pdo]  # adapters: the only layer allowed to use libraries and the database
# Any other library is in no layer: composer.json runs Deptrac with --fail-on-uncovered, so using one fails too.
